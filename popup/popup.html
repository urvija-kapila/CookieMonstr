<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookieMonstr</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="container">
    <h2>🛡 CookieMonstr</h2>

    <!-- Tab Navigation -->
    <div class="tab-navigation">
      <button class="tab-button active" data-tab="cookies">Cookies</button>
      <button class="tab-button" data-tab="storage">Storage</button>
      <button class="tab-button" data-tab="tracking">Tracking</button>
    </div>

    <!-- Cookies Tab -->
    <div id="cookies-tab" class="tab-content active">
      <div id="cookie-summary" class="audit-summary"></div>
      <div id="cookie-results"></div>
    </div>

    <!-- Storage Tab -->
    <div id="storage-tab" class="tab-content">
      <div id="storage-summary" class="audit-summary"></div>
      <div id="storage-results"></div>
    </div>

    <!-- Tracking Tab -->
    <div id="tracking-tab" class="tab-content">
      <div id="tracking-summary" class="audit-summary"></div>
      <div id="tracking-results"></div>
    </div>

    <!-- Export Section -->
    <div class="export-section">
      <button id="export-button" class="export-btn">📥 Export Report (JSON)</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
